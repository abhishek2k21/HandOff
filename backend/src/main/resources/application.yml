server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/handoff
    username: handoff
    password: handoff
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

  task:
    scheduling:
      pool:
        size: 4

handoff:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
    ws-ticket-expiration-seconds: ${WS_TICKET_EXPIRATION_SECONDS:30}
  ws:
    reconciliation-interval-ms: ${WS_RECONCILIATION_INTERVAL_MS:2000}
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    ping-interval-ms: ${WS_PING_INTERVAL_MS:15000}
    pong-timeout-ms: ${WS_PONG_TIMEOUT_MS:10000}
    heartbeat-tick-ms: ${WS_HEARTBEAT_TICK_MS:1000}
    max-subscriptions-per-connection: ${WS_MAX_SUBSCRIPTIONS_PER_CONNECTION:20}
    max-subscribers-per-session: ${WS_MAX_SUBSCRIBERS_PER_SESSION:200}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
    reset-on-start: ${DEMO_DATA_RESET_ON_START:false}
  agent:
    step-delay-ms: ${AGENT_STEP_DELAY_MS:0}

