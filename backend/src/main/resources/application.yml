server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/handoff
    username: handoff
    password: handoff
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

handoff:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
    ws-ticket-expiration-seconds: ${WS_TICKET_EXPIRATION_SECONDS:30}

